name: NEPSE Stock Price Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 11-15 * * 1-5"
      timezone: "Asia/Kathmandu"

permissions:
  contents: write

concurrency:
  group: nepse-stock-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect all available stock records
        run: python tracker.py

      - name: Commit CSV and Excel database
        run: |
          git config user.name "NEPSE Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_prices.csv data/stock_prices.xlsx
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Collect NEPSE stock snapshot"
            git push
          fi
